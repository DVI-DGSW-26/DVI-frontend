# 안드로이드 디버그 APK 빌드.
#
# 목적: 로컬에 Android Studio(10GB+) 를 깔지 않고도 실기기에 설치해볼 수 있는
# APK 를 얻는다. 빌드가 끝나면 Actions 실행 화면 하단 Artifacts 에서 받는다.
#
# 서명은 안드로이드 기본 디버그 키로 되므로 테스트 전용이다.
# 플레이스토어 업로드용 서명 빌드는 별도 워크플로가 필요하다.
name: 안드로이드 디버그 빌드

on:
  # Actions 탭에서 수동 실행
  workflow_dispatch:
  push:
    branches: [main, feat/capacitor-app]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Capacitor CLI 가 Node >=22 를 요구한다.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 백엔드 절대 주소. 저장소 Settings > Secrets and variables > Actions >
      # Variables 에 VITE_API_BASE_URL 을 등록하면 여기로 들어온다.
      # 비어 있으면 "/api" 상대경로가 되어 앱에서 API 호출이 실패한다.
      # (앱 실행·화면 확인은 되지만 로그인은 안 된다)
      - name: 웹 빌드
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      - name: 웹 결과물을 안드로이드 프로젝트로 복사
        run: npx cap sync android

      # Capacitor 8 의 capacitor-android 라이브러리가 Java 21 로 컴파일된다.
      # 17 로 두면 ":capacitor-android:compileDebugJavaWithJavac" 에서
      # "invalid source release: 21" 로 실패한다.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: APK 빌드
        run: ./gradlew assembleDebug --no-daemon
        working-directory: android

      - uses: actions/upload-artifact@v4
        with:
          name: qacflow-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
