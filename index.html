<!doctype html>
<!--
  translate="no" + notranslate 메타 — 브라우저 자동 번역 (Edge/Chrome 한국어 번역 등) 이
  React 가 추적하는 DOM 텍스트 노드를 wrap/replace 하면서 NotFoundError(insertBefore)
  를 일으키는 문제 방지. UI 가 이미 한국어라 번역 자체도 불필요.
-->
<html lang="ko" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- PWA: 홈 화면 설치 시 정식 앱(WebAPK)으로 동작해 로그인 세션이 유지되도록 함 -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#931B82" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="콱 플로우" />
    <link rel="apple-touch-icon" href="/app-icon.svg" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <title>콱 플로우</title>
  </head>
  <body class="notranslate">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
