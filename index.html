<!doctype html>
<!--
  translate="no" + notranslate 메타 — 브라우저 자동 번역 (Edge/Chrome 한국어 번역 등) 이
  React 가 추적하는 DOM 텍스트 노드를 wrap/replace 하면서 NotFoundError(insertBefore)
  를 일으키는 문제 방지. UI 가 이미 한국어라 번역 자체도 불필요.
-->
<html lang="ko" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <link rel="icon" type="image/png" href="/favicon.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- PWA: 홈 화면 설치 시 정식 앱(WebAPK)으로 동작해 로그인 세션이 유지되도록 함 -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#FFFFFF" />
    <!-- 저장된 테마를 React 가 뜨기 전에 칠해 둔다(첫 화면 깜빡임 방지). 키·값은 src/lib/theme.ts 와 같다. -->
    <script>
      try {
        var t = localStorage.getItem("theme") === "dark" ? "dark" : "light";
        document.documentElement.dataset.theme = t;
        if (t === "dark") document.querySelector("meta[name=theme-color]").setAttribute("content", "#161A21");
      } catch (e) {}
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="콱 플로우" />
    <link rel="apple-touch-icon" href="/app-icon.png" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <title>콱 플로우</title>
  </head>
  <body class="notranslate">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
